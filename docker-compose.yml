name: surrealdb-auth-example
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 15s
      timeout: 2s
      retries: 5
    environment:
      - SURREALDB_ENDPOINT=http://surrealdb:8000
      - SURREALDB_NS=surrealdb_auth_example
      - SURREALDB_DB=default
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - surrealdb

  surrealdb:
    command:
      - start
      - file:/db
      - --username
      - root
      - --password
      - root
    image: surrealdb/surrealdb:latest
    ports:
      - 8000:8000
    volumes:
      - ./surrealdb/db:/db
